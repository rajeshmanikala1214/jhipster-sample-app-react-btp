_schema-version: '3.1'
ID: jhipster-sample-app-react
version: 0.0.2
description: JHipster React + Spring Boot (Java 25) on SAP BTP Cloud Foundry with PostgreSQL and Redis

modules:
  # One Cloud Foundry app: Spring Boot REST API + React UI packaged in a single executable jar
  - name: jhipster-react-app
    type: java
    path: .
    build-parameters:
      builder: custom
      commands:
        - mvn -B -ntp -Pprod clean package -DskipTests
      build-result: target/jhipster-sample-application-react-*.jar
    parameters:
      buildpack: sap_java_buildpack_jakarta
      memory: 1536M
      disk-quota: 1024M
      instances: 1
      health-check-type: http
      health-check-http-endpoint: /management/health/liveness
      health-check-timeout: 180
    properties:
      SPRING_PROFILES_ACTIVE: prod,cf
      # Run on SapMachine 25 (the buildpack default is 21)
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: '{ version: 25.+ }'
      # The buildpack's memory calculator defaults direct memory to 10M, which is too small for the
      # Netty buffers of the Redis client (Redisson): OutOfDirectMemoryError and failed Redis DNS lookups
      JBP_CONFIG_JAVA_OPTS: "[java_opts: '-XX:MaxDirectMemorySize=128m']"
    requires:
      - name: ro-bank-postgres-sql
      - name: ro-bank-redis
      - name: jhipster-jwt-secret

resources:
  # All instances already exist in space "dev" and are only bound by this MTA,
  # so redeploying or undeploying the app never deletes them or the data they hold.
  - name: ro-bank-postgres-sql
    type: org.cloudfoundry.existing-service
  - name: ro-bank-redis
    type: org.cloudfoundry.existing-service
  # User-provided service holding the JWT signing key, created once per space:
  #   cf cups jhipster-jwt-secret -p '{"base64Secret":"<output of: openssl rand -base64 64 | tr -d \n>"}'
  - name: jhipster-jwt-secret
    type: org.cloudfoundry.existing-service
