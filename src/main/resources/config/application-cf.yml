# ===================================================================
# Spring Boot configuration for the "cf" profile
# (SAP BTP Cloud Foundry + PostgreSQL, hyperscaler option + Redis, hyperscaler option).
#
# Activate together with "prod": SPRING_PROFILES_ACTIVE=prod,cf (set in mta.yaml).
#
# Credentials are NOT stored here. Cloud Foundry injects them through the bindings to the
# service instances "ro-bank-postgres-sql" (service postgresql-db) and "ro-bank-redis"
# (service redis-cache), and Spring Boot exposes VCAP_SERVICES as
# vcap.services.<instance-name>.credentials.*
# ===================================================================

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    # The BTP PostgreSQL instance only accepts TLS connections and is reachable only from Cloud Foundry apps
    url: jdbc:postgresql://${vcap.services.ro-bank-postgres-sql.credentials.hostname}:${vcap.services.ro-bank-postgres-sql.credentials.port}/${vcap.services.ro-bank-postgres-sql.credentials.dbname}?sslmode=require
    username: ${vcap.services.ro-bank-postgres-sql.credentials.username}
    password: ${vcap.services.ro-bank-postgres-sql.credentials.password}
    hikari:
      maximum-pool-size: 5

jhipster:
  cache:
    redis:
      # Time to live of every cache entry, in seconds. Kept short so cache expiry is easy to observe.
      expiration: 300
      # The BTP Redis service only accepts TLS ("rediss"). Set REDIS_SCHEME=redis if a binding reports no TLS.
      server: ${REDIS_SCHEME:rediss}://${vcap.services.ro-bank-redis.credentials.hostname}:${vcap.services.ro-bank-redis.credentials.port}
      cluster: ${vcap.services.ro-bank-redis.credentials.cluster_mode:false}
      connection-pool-size: 8
      connection-minimum-idle-size: 2
      subscription-connection-pool-size: 2
      subscription-connection-minimum-idle-size: 1

application:
  redis:
    password: ${vcap.services.ro-bank-redis.credentials.password}

logging:
  level:
    # Logs every SQL statement, so a Redis cache hit (no SQL) is easy to tell apart from a miss (SQL logged).
    # Set to INFO once the cache behaviour has been verified.
    org.hibernate.SQL: DEBUG

# The JWT signing key must be supplied at deploy time through the
# JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET environment variable (see secrets.mtaext.example).
